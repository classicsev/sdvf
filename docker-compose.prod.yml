services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: finance_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт не публикуется наружу — доступ только из внутренней docker-сети.

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    # Порт не публикуется наружу. Сейчас Redis зарезервирован под будущие
    # фоновые задачи (банковские синки по расписанию) — приложение его пока не использует.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      - db
      - redis
    # Порт наружу не публикуется — доступ только через Caddy по внутренней docker-сети.
    # Без volume-монтирования кода и без --reload — используется образ как есть
    # (см. backend/Dockerfile), команда запуска — прод-CMD из образа.

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    depends_on:
      - backend
    # Порт наружу не публикуется — доступ только через Caddy по внутренней docker-сети.
    # Standalone-сборка Next.js (см. frontend/Dockerfile) — без dev-сервера.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Автоматически получает и продлевает бесплатные сертификаты Let's Encrypt
    # для доменов из Caddyfile — HTTPS без ручной настройки certbot/nginx.

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
